
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCVP Sequence Diagrams</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 48px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-button {
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background: #f0f0f0;
    }

    .tab-button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .diagram-container {
      width: 100%;
      height: calc(100vh - 180px);
      overflow: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
    }

    #diagramImage {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
    }
  </style>
</head>

<body>

  <h1>VCVP Sequence Diagrams</h1>

  <div class="tabs" id="tabs"></div>

  <div class="diagram-container">
    <img id="diagramImage" alt="Sequence Diagram">
  </div>

  <script>

    const diagrams = [
      {
        id: "trust",
        title: "ETDA Trusted List Load",
        svg: "./docs/trust-list-load-sequence.svg",
        reviewed: true
      },
	  {
        id: "vc1",
        title: "VC Issuance - part 1 request until offer link",
        svg: "./docs/vc-issuance-sequence15-1.svg",
        reviewed: true
      },
	  {
        id: "vc2",
        title: "VC Issuance - part 2 wallet receives and stores the credential",
        svg: "./docs/vc-issuance-sequence15-2.svg"
      },
	  {
        id: "vp",
        title: "VP Presentation - part 1 verifier setup and verification request",
        svg: "./docs/vp-presentation-sequence16-1.svg"
      },
	  {
        id: "vp2",
        title: "VP Presentation - part 2 QR scan to verifier result",
        svg: "./docs/vp-presentation-sequence16-2.svg"
      },
	  {
        id: "revoke",
        title: "Revoke/Suspend/Reactivate",
        svg: "./docs/Revoke-Suspend-Reactivate-sequence.svg"
      },
	  {
        id: "keycomp",
        title: "Issuer Key Compromise",
        svg: "./docs/Key-Compromise-sequence.svg"
      },
	  {
        id: "status",
        title: "Status List publication",
        svg: "./docs/Sequence-Lifecycle-Status-List.svg"
      },
	  {
        id: "consent",
        title: "Consent Withdrawal",
        svg: "./docs/Sequence-Lifecycle-Consent-Withdrawal-DSAR.svg"
      }
    ];

    // only the diagrams reviewed with the user are shown , the others stay listed for the build scripts
    const shown = diagrams.filter(diagram => diagram.reviewed);

    const tabs = document.getElementById("tabs");
    const diagramImage = document.getElementById("diagramImage");

    function showDiagram(index) {

      // "#" in a file name must be encoded, otherwise the browser treats it as a URL fragment
      diagramImage.src = shown[index].svg.replace(/#/g, "%23");
      diagramImage.alt = shown[index].title;

      document.querySelectorAll(".tab-button").forEach((button, buttonIndex) => {
        button.classList.toggle("active", buttonIndex === index);
      });

      // keep the open tab in the URL , e.g. #vc2 opens VC Issuance part 2
      history.replaceState(null, "", "#" + shown[index].id);
    }

    function showFromHash() {
      const index = shown.findIndex(diagram => "#" + diagram.id === location.hash);
      showDiagram(index < 0 ? 0 : index);
    }

    window.addEventListener("hashchange", showFromHash);

    shown.forEach((diagram, index) => {

      const button = document.createElement("button");

      button.className = "tab-button";
      button.textContent = diagram.title;

      button.addEventListener("click", () => {
        showDiagram(index);
      });

      tabs.appendChild(button);
    });

    showFromHash();

  </script>

</body>
</html>
